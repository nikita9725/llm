[project]
name = "llm-pipeline"
version = "0.1.0"
description = "A provider-neutral pipeline for structured LLM text processing"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
llm-pipeline = "cli:main"

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "application",
    "cli",
    "compare_prompts",
    "examples",
    "interfaces",
    "llm_client",
    "main",
    "pipeline",
    "prompts",
    "schemas",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "application.py",
    "cli.py",
    "main.py",
    "llm_client.py",
    "pipeline.py",
    "interfaces.py",
    "prompts.py",
    "schemas.py",
    "examples.py",
    "compare_prompts.py",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: component integration tests without network access",
    "e2e: calls a real, potentially paid LLM API",
]
