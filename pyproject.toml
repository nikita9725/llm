[project]
name = "llm-pipeline"
version = "0.1.0"
description = "A provider-neutral pipeline for structured LLM text processing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "main.py",
    "llm_client.py",
    "prompts.py",
    "schemas.py",
    "examples.py",
    "compare_prompts.py",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: calls a real, potentially paid LLM API",
]
